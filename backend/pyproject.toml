[project]
name = "spherex-explorer"
version = "0.1.0"
description = "Data service for SPHEREx Explorer: finds, aligns and measures SPHEREx observations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "scipy>=1.14",
    # Rice decoding of QR3 flags uses astropy.io.fits.hdu.compressed._codecs, so the
    # upper bound is deliberate: check that module before raising it.
    "astropy>=7.0,<9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
spherex-explorer = "spherex_explorer.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spherex_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # astropy.wcs notes SIP keywords on the spectral alternate WCS, which we evaluate ourselves.
    "ignore::astropy.wcs.FITSFixedWarning",
    # numpy on Apple Accelerate can report spurious matmul warnings on finite data.
    "ignore:.*encountered in matmul:RuntimeWarning",
]
markers = ["live: calls the real archive (deselected by default; run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # assert is fine in tests and internal invariants
    "RUF001", "RUF002", "RUF003",  # scientific text uses ×, µ, ° and similar on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["astropy.*", "scipy.*", "respx.*"]
ignore_missing_imports = true
